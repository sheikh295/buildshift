# LiteLLM → Vercel AI Gateway. Aliases must match Control / router.yaml model names.
# Prefer $0 free models for testing; cheap paid ≤ ~$0.15/$0.50 per 1M also registered.

model_list:
  # --- $0 free (max stretch for testing sprints) ---
  - model_name: minimax-m3.1-flash
    litellm_params:
      model: vercel_ai_gateway/minimax/minimax-m3.1-flash
      api_key: os.environ/VERCEL_AI_GATEWAY_API_KEY

  - model_name: nemotron-3.5-lightning-free
    litellm_params:
      model: vercel_ai_gateway/nvidia/nemotron-3.5-lightning-free
      api_key: os.environ/VERCEL_AI_GATEWAY_API_KEY

  # --- Cheap paid (≈ ≤ $0.15 / $0.50 per 1M) ---
  - model_name: mistral-nemo
