# Role → model. Aliases must exist in services/litellm/config.yaml.
# CTO/PM need reliable JSON (Minimax dumps reasoning prose). Workers stay on $0 Minimax.
roles:
  cto:
    tier: T3
    model: mistral-nemo
  pm:
    tier: T3
    model: mistral-nemo
  planner:
    tier: T3
    model: mistral-nemo
  prd_indexer:
    tier: T2
    model: mistral-nemo
  test_author:
    tier: T1
    model: minimax-m3.1-flash
  implementer:
    tier: T1
    model: minimax-m3.1-flash
    escalate_to: T2
  reviewer:
    tier: T2
    model: minimax-m3.1-flash

limits:
  task_budget_usd: 3.0
  daily_budget_usd: 60.0
  max_attempts_per_tier: 2
  max_parallel_workers: 4
