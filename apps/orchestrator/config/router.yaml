# Role → model. Aliases must exist in services/litellm/config.yaml.
# Default: $0 Minimax for testing sprints (stretch Vercel free credits).
roles:
  cto:
    tier: T3
    model: minimax-m3.1-flash
  pm:
    tier: T3
    model: minimax-m3.1-flash
  planner:
    tier: T3
    model: minimax-m3.1-flash
  prd_indexer:
    tier: T2
    model: minimax-m3.1-flash
  test_author:
    tier: T1
    model: minimax-m3.1-flash
  implementer:
    tier: T1
    model: minimax-m3.1-flash
    escalate_to: T2
  reviewer:
    tier: T2
    model: minimax-m3.1-flash

limits:
  task_budget_usd: 3.0
  daily_budget_usd: 60.0
  max_attempts_per_tier: 2
  max_parallel_workers: 4
